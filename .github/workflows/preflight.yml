name: preflight
on: [push, workflow_dispatch]
jobs:
  android-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ndk-build for x86
        run: |
          $ANDROID_NDK_LATEST_HOME/ndk-build --no-print-directory -j$(nproc) -C jni APP_ABI=x86 > build.log 2>&1 || {
            echo "=== FAILED ==="
            grep -nE "error:" build.log | head -20
            echo "--- context ---"
            grep -B6 -A2 "error:" build.log | head -60
            exit 1
          }
          ls -la libs/x86/; file libs/x86/libretro.so
